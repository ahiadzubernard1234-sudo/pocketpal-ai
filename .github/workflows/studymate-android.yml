name: StudyMate Android test build

# Builds an installable APK for testing. It is signed with the debug key, so it
# is fine for trying on your own phone but not for the Play Store.
#
# Runs on every push to the studymate-rebrand branch (ignoring docs-only
# changes) and can also be started by hand from the Actions tab.

on:
  push:
    branches:
      - studymate-rebrand
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/**'
  workflow_dispatch:

concurrency:
  group: studymate-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Same setting as the upstream CI: llama.rn is compiled from source.
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      # Must precede setup-node and setup-java: /opt/hostedtoolcache is where
      # those install. The Hexagon SDK adds ~3.1 GB to a from-source build.
      - name: Maximize build space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.21.0'
          cache: 'yarn'

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock', 'patches/**') }}

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Derive the rnllama variant allowlist from the payload manifest
        run: |
          set -euo pipefail
          VARIANTS=$(node scripts/verify-android-payload.js --print-variants)
          echo "Declared allowlist: $VARIANTS"
          echo "ORG_GRADLE_PROJECT_rnllamaVariants=$VARIANTS" >> "$GITHUB_ENV"

      - name: Cache llama.rn native build tree
        uses: actions/cache@v4
        with:
          path: node_modules/llama.rn/android/.cxx
          key: ${{ runner.os }}-cxx-${{ hashFiles('yarn.lock', 'patches/**', 'scripts/android-payload-manifest.json') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up the Hexagon SDK
        uses: ./.github/actions/setup-hexagon-sdk

      - name: Set up ccache
        uses: ./.github/actions/setup-ccache

      # The app reads these through react-native-config. They are placeholders:
      # StudyMate does not use PalsHub, sign-in or Firebase.
      - name: Create placeholder .env file
        run: |
          cat > .env << 'EOL'
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com

          SUPABASE_URL=https://dummy-supabase-url.supabase.co
          SUPABASE_ANON_KEY=dummy-anon-key-for-ci-builds
          PALSHUB_API_BASE_URL=https://dummy-palshub-api.com

          APP_URL=pocketpal://app

          ENABLE_PALSHUB_INTEGRATION=false
          ENABLE_AUTHENTICATION=false
          ENABLE_OFFLINE_MODE=true

          GOOGLE_IOS_CLIENT_ID=dummy-ios-client-id.apps.googleusercontent.com
          GOOGLE_WEB_CLIENT_ID=dummy-web-client-id.apps.googleusercontent.com
          EOL

      # No release keystore is created, so build.gradle falls back to the debug
      # keystore and prints a warning. That is expected for test builds.
      - name: Build Android APK (prod, release)
        working-directory: android
        run: ./gradlew assembleProdRelease 2>&1 | tee android-build.log

      - name: ccache statistics
        if: always()
        run: ccache --show-stats || echo "ccache unavailable"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/android-build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: studymate-android-apk
          path: android/app/build/outputs/apk/prod/release/app-prod-release.apk
